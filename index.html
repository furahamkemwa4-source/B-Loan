<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-Loan - Jisajili</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #0b5ed7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #888;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #0b5ed7;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>B-Loan</h1>
    <p>Karibu kwenye huduma ya mikopo</p>
  </header>

  <div class="container">
    <div class="card">

      <h2>Jisajili</h2>

      <form id="signupForm">

        <label>Jina kamili</label>
        <input id="fullName" type="text" placeholder="Andika jina lako" required>

        <label>Namba ya simu</label>
        <input id="phone" type="tel" placeholder="07XXXXXXXX" required>

        <label>Barua pepe</label>
        <input id="email" type="email" placeholder="example@email.com" required>

        <label>Nywila</label>
        <input id="password" type="password" placeholder="Weka nywila" minlength="6" required>

        <button id="signupButton" type="submit">JISAJILI</button>

      </form>

      <div id="message"></div>

      <div class="login">
        Tayari una akaunti?
        <a href="login.html">Ingia</a>
      </div>

    </div>
  </div>

  <script>

    // WEKA TAARIFA ZAKO HAPA
    const SUPABASE_URL = "WEKA_PROJECT_URL_HAPA";
    const SUPABASE_KEY = "WEKA_PUBLISHABLE_KEY_HAPA";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      https://hlpwblrpcomjwxrlpgmn.supabase.co/rest/v1/
      SUPABASE_KEY
      sb_publishable_kQRblGJQs7i8Hv3IAkfIog_Zghpin8p
    );

    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const button = document.getElementById("signupButton");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Inasajili...";

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName,
            phone: phone
          }
        }
      });

      if (error) {

        message.textContent = "Usajili umeshindikana: " + error.message;
        message.style.color = "red";

      } else {

        message.textContent =
          "Usajili umefanikiwa! Tafadhali angalia email yako.";
        message.style.color = "green";

        form.reset();
      }

      button.disabled = false;
      button.textContent = "JISAJILI";

    });

  </script>

</body>
</html>
