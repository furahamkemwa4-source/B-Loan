<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-Loan - Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 25px 20px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    .loan-button {
  display: block;
  width: 80%;
  max-width: 400px;
  padding: 15px;
  background: #0b5ed7;
  color: white;
  text-align: center;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
  margin: 20px auto 0;
}

    .logout {
      background: #dc3545;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>B-Loan</h1>
  <p>Dashboard yako</p>
</header>

<div class="container">

  <div class="card">
    <h2>Karibu kwenye B-Loan 👋</h2>

    <p>
      Umeingia kwenye akaunti yako kwa mafanikio.
    </p>

    <a href="loan-application.html" class="loan-button">
      OMBA MKOPO
    </a>
  </div>
<div class="card">
  <h2>Status ya Ombi Lako</h2>

  <p id="loanStatus">Inapakia...</p>
  <p id="loanAmount"></p>
  <p id="loanApprovedAmount"></p>
  <p id="loanInterest"></p>
  <p id="loanTotalRepayment"></p>
  <p id="loanDueDate"></p>
  <p id="loanPeriod"></p>
  <p id="loanDate"></p>
</div>
  <div class="card">
    <h2>Akaunti yangu</h2>

    <p>Hapa tutaweka taarifa zako.</p>

    <button class="logout" onclick="logout()">
      TOKA
    </button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://hlpwblrpcomjwxrlpgmn.supabase.co";
const SUPABASE_KEY = "sb_publishable_kQRblGJQs7i8Hv3IAkfIog_Zghpin8p";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = "login.html";

}

async function loadLoanStatus() {

  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  const { data, error } = await supabaseClient
    .from("loan_application")
    .select("amount, approved_amount, interest, repayment_period, status, due_date, created_at")
    .eq("user_id", user.id)
    .order("created_at", { ascending: false })
    .limit(1)
    .single();

  if (error) {
    document.getElementById("loanStatus").textContent =
      "Hakuna ombi la mkopo lililopatikana.";
    return;
  }

 const statusElement = document.getElementById("loanStatus");

statusElement.textContent = "Status: " + data.status;

if (data.status === "approved") {
  statusElement.style.color = "green";
} else if (data.status === "rejected") {
  statusElement.style.color = "red";
} else {
  statusElement.style.color = "orange";
} 

  document.getElementById("loanAmount").textContent =
  "Kiasi ulichoomba: TSh " + data.amount;

document.getElementById("loanApprovedAmount").textContent =
  "Kiasi kilichoidhinishwa: TSh " + (data.approved_amount || "Bado hakijawekwa");
  document.getElementById("loanInterest").textContent =
  "Riba: TSh " + (data.interest || "Bado haijawekwa");
  const totalRepayment =
  Number(data.approved_amount || 0) + Number(data.interest || 0);

document.getElementById("loanTotalRepayment").textContent =
  "Jumla ya kurejesha: TSh " + totalRepayment;
  document.getElementById("loanDueDate").textContent =
  "Tarehe ya mwisho ya kurejesha: " +
  (data.due_date || "Bado haijawekwa");

  document.getElementById("loanPeriod").textContent =
    "Muda: " + data.repayment_period;

  document.getElementById("loanDate").textContent =
    "Tarehe: " + new Date(data.created_at).toLocaleString();
}

loadLoanStatus();

</script>

</body>
</html>
