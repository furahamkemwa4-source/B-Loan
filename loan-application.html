<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-Loan - Omba Mkopo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
    }

    header {
      background: #0b5ed7;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 550px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #0b5ed7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0b5ed7;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>B-Loan</h1>
  <p>Omba Mkopo</p>
</header>

<div class="container">

  <div class="card">

    <h2>Fomu ya Maombi ya Mkopo</h2>

    <form>

      <label>Kiasi cha mkopo (TSh)</label>
      <input
  id="amount"
  type="number"
  placeholder="Mfano: 100000"
  required
>
        
        
        
      

      <label>Muda wa marejesho</label>
      <select id="repayment_period" required>
        <option value="">Chagua muda</option>
        <option>7 Days</option>
        <option>14 Days</option>
        <option>30 Days</option>
        <option>60 Days</option>
        <option>90 Days</option>
      </select>

      <label>Sababu ya kuomba mkopo</label>
      <input
  id="reason"
  type="text"
  placeholder="Mfano: Biashara"
  required
>
        
        
        
      

      <label>Namba ya simu</label>
      <input
  id="phone"
  type="tel"
  placeholder="07XXXXXXXX"
  required
>
        
        
        
    

      <button type="submit">
        TUMA MAOMBI
      </button>

    <form id="loanForm">

    <a href="dashboard.html" class="back">
      ← Rudi Dashboard
    </a>

  </div>

</div>
<script>
const SUPABASE_URL = "https://hlpwblrpcomjwxrlpgmn.supabase.co";
const SUPABASE_KEY = "sb_publishable_kQRblGJQs7i8Hv3IAkfIog_Zghpin8p";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
</script>
<script>
document.getElementById("loanForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const amount = document.getElementById("amount").value;
  const repaymentPeriod = document.getElementById("repayment_period").value;
  const reason = document.getElementById("reason").value;
  const phone = document.getElementById("phone").value;

  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("Tafadhali ingia kwanza.");
    window.location.href = "login.html";
    return;
  }

  const { error } = await supabaseClient
    .from("loan_application")
    .insert({
      user_id: user.id,
      amount: amount,
      repayment_period: repaymentPeriod,
      reason: reason,
      phone: phone
    });

  if (error) {
    alert("Maombi hayajatumwa: " + error.message);
  } else {
    alert("Maombi yako ya mkopo yametumwa kikamilifu!");
    window.location.href = "dashboard.html";
  }

});
</script>      
</body>
</html>
