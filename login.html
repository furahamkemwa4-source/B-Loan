<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-Loan - Ingia</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 32px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #0b5ed7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      background: #888;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .register {
      text-align: center;
      margin-top: 20px;
    }

    .register a {
      color: #0b5ed7;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>B-Loan</h1>
    <p>Karibu tena</p>
  </header>

  <div class="container">
    <div class="card">

      <h2>Ingia</h2>

      <form id="loginForm">

        <label>Barua pepe</label>
        <input
          id="email"
          type="email"
          placeholder="example@email.com"
          required
        >

        <label>Nywila</label>
        <input
          id="password"
          type="password"
          placeholder="Weka nywila"
          required
        >

        <button id="loginButton" type="submit">
          INGIA
        </button>

      </form>

      <div id="message"></div>

      <div class="register">
        Huna akaunti?
        <a href="index.html">Jisajili</a>
      </div>

    </div>
  </div>

  <script>

    const SUPABASE_URL = "https://hlpwblrpcomjwxrlpgmn.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_kQRblGJQs7i8Hv3IAkfIog_Zghpin8p";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Inaingia...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.textContent =
          "Login imeshindikana: " + error.message;

        message.style.color = "red";

      } else {

        message.textContent =
          "Umeingia kwenye B-Loan!";

        message.style.color = "green";

        // Kwa sasa tunabaki kwenye ukurasa huu
      }

      button.disabled = false;
      button.textContent = "INGIA";

    });

  </script>

</body>
</html>
